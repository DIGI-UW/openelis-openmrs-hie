secrets: 
  common.properties:
    file:  ./configs/openelis/properties/common.properties 

networks:
  openelis-network:
    name: openelis-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.1.0/24  
        
volumes:
  db-data:
  key_trust-store-volume:
  certs-vol:
  keys-vol:
  lucene_index-vol:
  bridge-state:
  openmrs-data:
  omrs-db-data:
  hapi-data:
  hapi-fhir-db:
