# SSL config for the FHIR Client
server.ssl.key-store = file:${SSL_KEYSTORE_PATH}
server.ssl.key-store-password = ${SSL_KEYSTORE_PASSWORD}
server.ssl.key-password = ${SSL_KEYSTORE_PASSWORD}
server.ssl.trust-store= file:${SSL_TRUSTSTORE_PATH}
server.ssl.trust-store-password=${SSL_TRUSTSTORE_PASSWORD}

#/usr/local/tomcat/webapps/OpenELIS-Global/certs
encryption.general.password=${OE_ENCRYPTION_PASSWORD}

# Co-Resdent FHIR Server
org.openelisglobal.fhirstore.uri=https://fhir.openelis.org:8443/fhir/
# OpenHIM client OpenELIS (configs/openhim/configs/openhim-config.json). OpenELIS
# sends these with HTTP Basic to every FHIR server other than its own store:
# the orders it polls and the providers it imports through OpenHIM.
org.openelisglobal.fhirstore.username=OpenELIS
org.openelisglobal.fhirstore.password=admin

# Minutes between scheduled retries for failed FHIR exports. Lower values
# give faster recovery from outages but increase load on the partner FHIR
# server. 5 matches the historical default in RegisterFhirHooksTask; tune
# downward only after measuring partner capacity.
org.openelisglobal.fhir.subscriber.backup.interval=5

org.openelisglobal.fhir.transformOnStartup=false

#open client registry authentication
org.openelisglobal.crserver.uri=
org.openelisglobal.crserver.username=
org.openelisglobal.crserver.password=

# Lab orders from OpenMRS: OpenELIS polls the SHR through OpenHIM for Tasks
# (status requested) owned by any Practitioner, every 20 seconds, and sets the
# remote Task to accepted or rejected.
org.openelisglobal.remote.source.uri=http://openhim-core:5001/fhir/
org.openelisglobal.remote.source.updateStatus=true
org.openelisglobal.remote.source.identifier=Practitioner/*
org.openelisglobal.remote.poll.frequency=20000
org.openelisglobal.task.useBasedOn=true

org.openelisglobal.fhir.subscriber=http://openhim-core:5001/fhir/
org.openelisglobal.fhir.subscriber.resources=Task,Patient,ServiceRequest,DiagnosticReport,Observation,Specimen,Practitioner,Encounter

#Facility FHIR fhirstore
org.openelisglobal.facilitylist.fhirstore =  
org.openelisglobal.facilitylist.authurl=
org.openelisglobal.facilitylist.username=
org.openelisglobal.facilitylist.password=
org.openelisglobal.facilitylist.auth= 
facilitylist.schedule.fixedRate=864000000

#provider FHIR server
# Providers (Practitioner resources) imported from the SHR through OpenHIM.
org.openelisglobal.providerlist.fhirstore=http://openhim-core:5001/fhir/
org.openelisglobal.requester.identifier=
org.openelisglobal.providerlist.poll.frequency=120000
org.openelisglobal.requester.lastName=
org.openelisglobal.requester.firstName=
org.openelisglobal.requester.phone=

#Hibernate Config 
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true

#Paging properties
org.openelisglobal.paging.patients.pageSize=99
org.openelisglobal.paging.results.pageSize=99
org.openelisglobal.paging.validation.pageSize=99
org.openelisglobal.paging.displaylist.pageSize=99
org.openelisglobal.paging.orderprograms.pageSize=99


# Odoo Integration Configuration
org.openelisglobal.odoo.enabled=false
org.openelisglobal.odoo.map.testname.locale=en
org.openelisglobal.odoo.baseUrl=
org.openelisglobal.odoo.database=
org.openelisglobal.odoo.username=
org.openelisglobal.odoo.password=

#AUto create Programmes from Questionare Resources under programs directory
org.openelisglobal.program.autocreate = true

#HelpMenu URLs
org.openelisglobal.help.manual.url=https://uwdigi.atlassian.net/wiki/spaces/OG/folder/261455874
org.openelisglobal.help.tutorials.url=https://video.openelis-global.org
org.openelisglobal.help.release-notes.url=https://roadmap.openelis-global.org

#Loading configurationss
# Loads the test catalogue in configs/openelis/configuration/backend, including
# the LOINC codes that OpenMRS orders are matched on.
org.openelisglobal.configuration.autocreate=true
org.openelisglobal.configuration.dir=/var/lib/openelis-global/configuration/backend

# Set false to use checksums. it is set to true by default to reload all configs on startup
# org.openelisglobal.configuration.forcereload=false

#SAML Configuration
org.itech.login.saml=false
org.itech.login.saml.registrationId=keycloak
org.itech.login.saml.loginpage=true
org.itech.login.saml.entityId=OpenELIS-Global_saml
org.itech.login.saml.metadatalocation=http://keycloak.openelis.org:8080/realms/OpenELIS/protocol/saml/descriptor

#OCL import
org.openelisglobal.ocl.import.default.testsection=Hematology
org.openelisglobal.ocl.import.default.sampletype=Whole Blood

# Freezer Monitoring Configuration
org.openelisglobal.freezermonitoring.enabled=true
org.openelisglobal.freezermonitoring.modbus.poll-interval=PT5M
org.openelisglobal.freezermonitoring.modbus.initial-delay=PT15S
org.openelisglobal.freezermonitoring.modbus.timeout-millis=2000
org.openelisglobal.freezermonitoring.modbus.retries=1

#Enable/Diable filtering MenuItems by Config files
org.openelisglobal.menu.configuration.autocreate=false


#Unique Facility Details 
